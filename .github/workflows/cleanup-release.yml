name: Cleanup old release assets

# One-shot: removes the pre-rename heatit_* archive assets (plus a stray test
# asset) from the v1.0.0 release. Delete this workflow after running it once.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const h = {
              Authorization: 'token ' + process.env.GITHUB_TOKEN,
              Accept: 'application/vnd.github+json',
            }
            const base = 'https://api.github.com'
            const repo = `${context.repo.owner}/${context.repo.repo}`
            const get = async (url) => {
              const r = await fetch(url, { headers: h })
              const t = await r.text()
              let b
              try { b = JSON.parse(t) } catch { b = t }
              core.info(`GET ${url} -> ${r.status}`)
              return { status: r.status, body: b }
            }
            const del = async (url) => {
              const r = await fetch(url, { method: 'DELETE', headers: h })
              core.info(`DELETE ${url} -> ${r.status}`)
              return r.status
            }
            const rel = (await get(`${base}/repos/${repo}/releases/tags/v1.0.0`)).body
            if (typeof rel !== 'object' || rel.message) { core.setFailed('release lookup failed: ' + JSON.stringify(rel)); return }
            let assets = (await get(`${base}/repos/${repo}/releases/${rel.id}/assets?per_page=100`)).body
            if (!Array.isArray(assets)) { core.setFailed('assets lookup failed: ' + JSON.stringify(assets)); return }
            for (const a of assets) {
              if (a.name.startsWith('heatit_') || a.name === 'asset_test.bin') {
                await del(`${base}/repos/${repo}/releases/${rel.id}/assets/${a.id}`)
              }
            }
