name: Cleanup old release assets

# One-shot: removes the pre-rename heatit_* archive assets (plus a stray test
# asset) from the v1.0.0 release. Delete this workflow after running it once.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const base = 'https://api.github.com'
            const h = {
              Authorization: 'token ' + process.env.GITHUB_TOKEN,
              Accept: 'application/vnd.github+json',
            }
            const repo = `${context.repo.owner}/${context.repo.repo}`
            const rel = await (await fetch(`${base}/repos/${repo}/releases/tags/v1.0.0`, { headers: h })).json()
            const assets = await (await fetch(`${base}/repos/${repo}/releases/${rel.id}/assets?per_page=100`, { headers: h })).json()
            for (const a of assets) {
              if (a.name.startsWith('heatit_') || a.name === 'asset_test.bin') {
                const r = await fetch(`${base}/repos/${repo}/releases/${rel.id}/assets/${a.id}`, { method: 'DELETE', headers: h })
                core.info(`${a.name} -> ${r.status}`)
              }
            }
